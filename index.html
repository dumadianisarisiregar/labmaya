juara:()=>{const rb=T.jt||"Antar Kelas",B=board(),me=S.cur,M=["🥇","🥈","🥉"],sn=n=>esc(n.split(" ").slice(0,2).join(" ")),cls=Object.keys(ROS).map(k=>{const sz=ROS[k].split(";").length,m=B.filter(x=>x.r==k),t=m.reduce((a,x)=>a+x.xp,0);return{k,sz,n:m.length,t,sc:Math.round(t/sz)}}).sort((a,b)=>b.sc-a.sc),list=(rb=="Antar Kelas"?B:B.filter(x=>x.r==rb)).sort((a,b)=>b.xp-a.xp||b.lv-a.lv),top=list.slice(0,3);return `<main><h2>🏆 Juara Kelas</h2>${bub("Kumpulkan XP sebanyak-banyaknya untuk membawa kelasmu jadi juara PPLG Kelas X!")}<div class="tabs">${["Antar Kelas",...Object.keys(ROS)].map(n=>`<button class="btn ${n==rb?"":"g"}" onclick="T.jt='${n}';R()">${n}</button>`).join("")}</div>${rb=="Antar Kelas"?`<div class="card"><h3>Peringkat Kelas</h3><p>Skor kelas = total XP ÷ jumlah siswa kelas.</p>${cls.map((c,i)=>`<div class="rk"><b>${M[i]||i+1}</b><span>PPLG ${c.k}<br><small>${c.n}/${c.sz} siswa aktif · ${c.t} XP</small></span><b>${c.sc}</b></div>`).join("")}</div>`:""}<div class="pod">${[1,0,2].map(i=>top[i]?`<div class="p${i+1}"><div class="big">${M[i]}</div><b>${sn(top[i].n)}</b><br><small>${top[i].r}</small><br>${top[i].xp} XP</div>`:"").join("")}</div><div class="card"><h3>${rb=="Antar Kelas"?"Top 10 Siswa":"Papan Juara "+rb}</h3>${list.slice(0,10).map((x,i)=>`<div class="rk ${x.nis==me?"me":""}"><b>${M[i]||i+1}</b><span>${sn(x.n)} <small>${x.r}</small>${x.nis==me?" (kamu)":""}</span><b>${x.xp} XP</b></div>`).join("")||"<p>Belum ada skor. Jadilah yang pertama!</p>"}</div><p><small>${DBok?"Data gabungan dari semua perangkat yang tersinkron.":"Menampilkan data dari perangkat ini saja."}</small></p></main>`},rep:()=>{const d=new Date().toLocaleDateString("id-ID"),u=U();return `<main><h2>Laporan Capaian Tebak Terminal</h2><div class="card">Nama: <b>${esc(ME().n)}</b> · NIS: ${S.cur} · Rombel: ${ME().r} (PPLG Kelas X)<br>Pengajar: Bu Duma · Kreator: Duma Diani · ${d}<br><b>Total ${u.xp} XP · ${nDone()}/30 level · ${rank()}</b><br>Hari hadir: ${Object.keys(u.att).length}</div><table><tr><th>Dunia</th><th>Level tuntas</th><th>Percobaan</th><th>Hint</th><th>XP</th></tr>${WN.map((w,wi)=>{let n=0,t=0,h=0,x=0;for(let k=1;k<=5;k++){const l=wi*5+k;if(lvDone(l))n++;(u.lv[l]||[]).forEach(q=>{t+=q.t||0;h+=q.h||0;x+=q.xp||0})}return `<tr><td>${wi+1}. ${w}</td><td>${n}/5</td><td>${t}</td><td>${h}</td><td>${x}</td></tr>`}).join("")}</table><div class="card"><h3>Penerapan di Dunia Kerja</h3><p>Membaca kode dan melacak bug adalah kerja harian Software Developer dan QA Engineer: mereka harus memahami apa yang dilakukan program sebelum menjalankannya.</p></div><div class="card noprint"><h3>Refleksi Diri</h3><p>Seberapa yakin kamu membaca kode? ${[1,2,3,4].map(n=>`<button class="btn ${u.sc==n?"":"g"}" onclick="U().sc=${n};save();R()">${n}</button>`).join(" ")}</p><textarea style="width:100%;background:var(--card);color:var(--fg);border-radius:10px" rows="2" placeholder="Bagian mana yang paling menjebak?" oninput="U().fbk=this.value;save()">${esc(u.fbk||"")}</textarea></div><div class="noprint"><button class="btn" onclick="print()">Cetak Laporan / PDF</button> <button class="btn g" onclick="if(confirm('Reset semua progres akunmu?')){S.users[S.cur]=newU();save();go('home')}">Ulangi Main</button> <button class="btn g" onclick="go('home')">Laman Muka</button></div></main>`},
guru:()=>{const rb=T.rb||"X-1",d=today(),rows=ROS[rb].split(";").map(e=>{const n=e.slice(0,8),u=S.users[n];return [n,e.slice(9),u&&u.att[d]?u.att[d].t:"-",u?Object.keys(u.dd).length:0,u?u.xp:0]}),csv="NIS,Nama,Rombel,Hadir "+d+",Level,XP\n"+rows.map(x=>[x[0],'"'+x[1]+'"',rb,x[2],x[3],x[4]].join(",")).join("\n");return `<main><h2>Rekap Guru · Absensi &amp; Progres</h2><select onchange="T.rb=this.value;R()">${Object.keys(ROS).map(k=>`<option ${k==rb?"selected":""}>${k}</option>`).join("")}</select><p>Hadir hari ini: <b>${rows.filter(x=>x[2]!="-").length}</b> dari ${rows.length}. Data berasal dari perangkat ini saja.</p><table><tr><th>NIS</th><th>Nama</th><th>Hadir</th><th>Level</th><th>XP</th></tr>${rows.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join("")}</table><h3>Salin Rekap (CSV)</h3><textarea style="width:100%;background:var(--card);color:var(--fg)" rows="5" readonly onfocus="this.select()">${esc(csv)}</textarea></main>`}};
const newU=()=>({xp:0,lv:{},dd:{},att:{},seen:0,sc:0});
function guru(){if(prompt("PIN guru:")=="guru2026")go("guru");else toast("PIN salah",200)}
function reg(){const v=nis.value.trim();T.f=RS[v]?v:null;T.e=RS[v]?"":"NIS tidak ditemukan. Periksa lagi atau tanyakan ke Bu Duma.";if(!RS[v])beep(200,.3);R()}
function login(n){S.cur=n;S.users[n]=S.users[n]||newU();save();toast("Halo, "+RS[n].n.split(" ")[0]+"!",880);go(U().seen?"map":"brief")}
function tut(){const ok=norm(ta.value)=="8";beep(ok?880:200,.25);T.tab=2;T.tr=ok?"Benar! 5 + 3 = 8":"Belum tepat. Coba hitung x + y.";R()}
function start(l){const sh=a=>a.sort(()=>Math.random()-.5);cur={l,i:0,lives:3,qs:[1,2].map(k=>{const q=G[LV[l-1][k]]();q.mc=!isDbg(l)&&l%2==1&&/^\d+$/.test(q.a);if(q.mc){const a=+q.a;q.ops=sh([...new Set([a,a+1,a+2,Math.max(0,a-1)])]);}return q})};cur.i=qr(l,0).r?1:0;go(isDbg(l)?"debug":"sim")}
function nx(){if(st<Q().t.length){st++;beep(500,.08);R()}}
function run(){st=0;clearInterval(play);play=setInterval(()=>{if(st>=Q().t.length)return clearInterval(play);nx()},700)}
function award(r){const b=xpq(cur.l);r.g=1;r.xp=Math.max(0,(r.s?b/2:b)-25*r.h);U().xp+=r.xp;save();toast("+"+r.xp+" XP!",1000)}
function wrong(){beep(200,.3);if(boss(cur.l)&&--cur.lives<=0){alert("Nyawa habis! Ulangi level ini.");return start(cur.l)}}
function chk(){const q=Q(),r=qr(cur.l,cur.i);r.t++;if(norm(T.v||"")==norm(q.a)){award(r);T.fb=""}else{T.fb="<p class='bad'>[Output Mismatch! Telusuri ulang baris demi baris]</p>";save();wrong();if(sc!="guess")return}R()}
function hint(){const r=qr(cur.l,cur.i);if(!T.hint){r.h++;save();beep(900,.1)}T.hint=1;R()}
function sol(){if(!confirm("Buka solusi? XP dikurangi 50%."))return;const q=Q(),r=qr(cur.l,cur.i);r.s=1;r.t++;T.v=q.a;award(r);T.fb="<p class='ok'>Solusi: "+esc(q.a)+"</p>";R()}
function dbg(){const q=Q(),r=qr(cur.l,cur.i);r.t++;if(sel==q.bug){award(r);r.r=1;T.fb="";fin2()}else{T.fb="<p class='bad'>Bukan baris itu. Pilih baris yang salah.</p>";save();wrong();if(sc!="debug")return}R()}
function fin(){const q=Q(),r=qr(cur.l,cur.i);if(T.pk!=q.k)return fb.textContent="Pilih jawaban yang benar dulu.";if((T.n||"").trim().length<10)return fb.textContent="Catatan minimal 10 karakter.";r.r=1;U().xp+=20;toast("+20 XP Bonus!",1200);fin2()}
function fin2(){if(qr(cur.l,0).r&&qr(cur.l,1).r&&!U().dd[cur.l]){U().dd[cur.l]=today();U().xp+=40}save();R()}
function nxt(){T={};if(cur.i<1){cur.i=qr(cur.l,1).r?2:1;if(cur.i<2)return go(isDbg(cur.l)?"debug":"sim")}confetti();go("done")}
function absen(){const d=today(),n=Object.values(U().dd).filter(x=>x==d).length;if(!n)return toast("Selesaikan 1 level dulu",200);U().att[d]={t:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}),n,xp:U().xp};save();toast("Absen tercatat ✓",880);R()}
function gameView(){const g=T.g;if(!g)return `<p>Skor tertinggi XP game: maks 100 XP per hari.</p><button class="btn" onclick="gStart()">Mulai!</button>`;if(g.done)return `<h2>Waktu habis!</h2><p class="big">${g.s}</p><p>${g.x?`+${g.x} XP masuk ke akunmu`:"XP game hari ini sudah diambil"}</p><button class="btn" onclick="gStart()">Main Lagi</button>`;return `<p>⏱ ${g.t}s · Skor <b>${g.s}</b> · Combo ×${g.c}</p><h2 class="mono">${esc(g.e)}</h2><button class="btn" onclick="gAns(true)">True</button> <button class="btn g" onclick="gAns(false)">False</button>`}
function gUp(){const e=document.getElementById("gm");if(e)e.innerHTML=gameView()}
function gNext(){const a=r(2,12),b=r(2,9),c=r(1,9),k=r(0,2);let e,tr;if(k==0){const v=a+b*c,s=Math.random()<.5?v:v+r(1,3);e=`${a} + ${b} * ${c} == ${s}`;tr=s==v}else if(k==1){e=`${a} > ${b} and ${b} > ${c}`;tr=a>b&&b>c}else{const v=(a*b+c)%b,s=Math.random()<.5?v:v+1;e=`${a*b+c} % ${b} == ${s}`;tr=s==v}T.g.e=e;T.g.tr=tr}
function gStart(){T.g={t:30,s:0,c:0};gNext();clearInterval(play);play=setInterval(()=>{if(sc!="game")return clearInterval(play);T.g.t--;if(T.g.t<=0){clearInterval(play);const x=U().gd==today()?0:Math.min(100,Math.floor(T.g.s/2));if(x){U().gd=today();U().xp+=x;save()}T.g.x=x;T.g.done=1;confetti()}gUp()},1000);gUp()}
function gAns(v){const g=T.g;if(v==g.tr){g.c++;g.s+=10+Math.min(g.c,5)*2;beep(880,.07)}else{g.c=0;g.s=Math.max(0,g.s-5);beep(200,.2)}gNext();gUp()}
let DB=null,DBok=false,SC={},lastV="",sy,qt;const byId=i=>document.getElementById(i);
function board(){const m={};Object.keys(S.users).forEach(n=>{const u=S.users[n];if(RS[n])m[n]={nis:n,n:RS[n].n,r:RS[n].r,xp:u.xp,lv:Object.keys(u.dd).length}});Object.entries(SC).forEach(([n,d])=>{if(RS[n]&&d&&(!m[n]||d.xp>m[n].xp))m[n]={nis:n,n:RS[n].n,r:RS[n].r,xp:d.xp,lv:d.lv}});return Object.values(m).filter(x=>x.xp>0)}
function sync(){if(!DB||!S.cur||!RS[S.cur])return;const u=S.users[S.cur],v=u.xp+"|"+Object.keys(u.dd).length;if(v==lastV)return;clearTimeout(sy);sy=setTimeout(()=>{DB.doc("scores/"+S.cur).set({xp:u.xp,lv:Object.keys(u.dd).length,t:Date.now()}).then(()=>{lastV=v}).catch(()=>{})},2000)}
(async()=>{try{if(!window.claude||!claude.use)return;DB=await claude.use("db");if(!DB)return;DB.collection("scores").onSnapshot(s=>{SC={};s.docs.forEach(d=>{SC[d.id]=d.data()});DBok=true;if(sc=="juara")R()},()=>{DBok=false});sync()}catch(e){DB=null}})();
function gameView(){const g=T.g;if(!g)return `<div class="float">${BOT}</div><p>Bantu robot menembak bug! Jawab True atau False sebelum bug mencapai robot. Robot punya 3 baterai.</p><button class="btn" onclick="gStart()">Mulai!</button>`;if(g.done)return `<div class="big">${g.en>0?"🤖🎉":"🤖💥"}</div><h2>${g.en>0?"Waktu habis!":"Baterai habis!"}</h2><p class="big">${g.s}</p><p>${g.x?`+${g.x} XP masuk ke akunmu`:"XP game hari ini sudah diambil"}</p><button class="btn" onclick="gStart()">Main Lagi</button> <button class="btn g" onclick="go('juara')">🏆 Lihat Juara</button>`;return `<div class="hud"><span>⏱ <b id="gt">${g.t}</b>s</span><span>⭐ <b id="gs">${g.s}</b></span><span>🔥 ×<b id="gc">${g.c}</b></span><span id="ge">${"🔋".repeat(g.en)}</span></div><div class="arena"><div class="gbot" id="gb">${BOT}</div><div class="gbug" id="gg">🐛</div><div class="laser" id="gl"></div></div><h2 class="mono" id="gx"></h2><button class="btn" onclick="gAns(true)">True</button> <button class="btn g" onclick="gAns(false)">False</button>`}
function gUp(){const g=T.g;if(!g||g.done||!byId("gt"))return;byId("gt").textContent=g.t;byId("gs").textContent=g.s;byId("gc").textContent=g.c;byId("ge").textContent="🔋".repeat(Math.max(0,g.en))}
function gBegin(){const g=T.g;if(!g||g.done||!byId("gg"))return;g.lock=0;gNext();byId("gx").textContent=g.e;const b=byId("gg"),ms=Math.max(2200,5000-g.s*15);b.className="gbug";b.style.transition="none";b.style.left="86%";void b.offsetWidth;b.style.transition=`left ${ms}ms linear`;b.style.left="24%";clearTimeout(qt);qt=setTimeout(gHit,ms)}
function gHit(){const g=T.g;if(!g||g.done||sc!="game")return;g.c=0;g.en--;beep(150,.3);byId("gb").className="gbot hit";setTimeout(()=>{const e=byId("gb");e&&(e.className="gbot")},400);gUp();if(g.en<=0)gEnd();else gBegin()}
function gStart(){clearInterval(play);clearTimeout(qt);T.g={t:30,s:0,c:0,en:3};byId("gm").innerHTML=gameView();gBegin();play=setInterval(()=>{if(sc!="game"||!T.g)return clearInterval(play);T.g.t--;gUp();if(T.g.t<=0)gEnd()},1000)}
function gAns(v){const g=T.g;if(!g||g.done||g.lock)return;clearTimeout(qt);g.lock=1;if(v==g.tr){g.c++;g.s+=10+Math.min(g.c,5)*2;beep(880,.07);byId("gl").className="laser fire";byId("gg").className="gbug boom";byId("gb").className="gbot happy";gUp();setTimeout(()=>{const e=byId("gb");e&&(e.className="gbot");gBegin()},380)}else{g.c=0;g.s=Math.max(0,g.s-5);g.en--;beep(200,.2);byId("gb").className="gbot hit";gUp();setTimeout(()=>{const e=byId("gb");e&&(e.className="gbot");if(g.en<=0)gEnd();else gBegin()},400)}}
function gEnd(){const g=T.g;if(!g||g.done)return;g.done=1;clearInterval(play);clearTimeout(qt);const x=U().gd==today()?0:Math.min(100,Math.floor(g.s/2));if(x){U().gd=today();U().xp+=x;save()}g.x=x;confetti();byId("gm").innerHTML=gameView()}
R();
</script></body></html>
